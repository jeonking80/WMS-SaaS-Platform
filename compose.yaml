name: wms-lite

services:
  db:
    image: postgres:17.9-bookworm
    environment:
      POSTGRES_DB: wms_lite
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wms_lite"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-test:
    image: postgres:17.9-bookworm
    profiles: [test]
    environment:
      POSTGRES_DB: wms_lite_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wms_lite_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
